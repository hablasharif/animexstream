<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>AnimeStreamX — Watch Anime Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://graphql.anilist.co">
<link rel="preconnect" href="https://api.jikan.moe" crossorigin>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06060f;
  --bg2:#0b0b18;
  --bg3:#10101e;
  --bg4:#171728;
  --border:#1c1c32;
  --border2:#262640;
  --accent:#7c6fe0;
  --accent2:#b39dfc;
  --pink:#f06ca0;
  --green:#2ecc8e;
  --orange:#f59e0b;
  --teal:#06b6d4;
  --red:#ef4444;
  --text:#eeeef8;
  --text2:#8888aa;
  --text3:#44445a;
  --card-r:14px;
  --tr:.2s ease;
  --side-w:300px;
  --grad:linear-gradient(135deg,#7c6fe0,#f06ca0);
}
html{-webkit-text-size-adjust:100%}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);overflow:hidden;overscroll-behavior:none}
#root{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
#view-home,#view-player{position:absolute;inset:0;transition:opacity .35s ease,transform .35s ease}
#view-home{z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#view-player{z-index:2;opacity:0;pointer-events:none;transform:translateY(18px);display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#view-player.active{opacity:1;pointer-events:all;transform:translateY(0)}
#view-home.hidden{opacity:0;pointer-events:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

/* ── NAVBAR ── */
#navbar{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:14px;padding:0 22px;height:56px;background:rgba(6,6,15,.93);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);flex-shrink:0}
.logo{font-family:'Outfit',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;cursor:pointer;flex-shrink:0}
#search-wrap{flex:1;min-width:0;max-width:440px;position:relative}
#search-inp{width:100%;padding:8px 34px 8px 38px;background:var(--bg3);border:1px solid var(--border2);border-radius:22px;color:var(--text);font-size:13.5px;font-family:'Outfit',sans-serif;outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
#search-inp::placeholder{color:var(--text3)}
#search-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,111,224,.18)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
#search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;border:none;background:var(--bg4);color:var(--text3);font-size:11px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all var(--tr)}
#search-clear.show{display:flex}
#search-clear:hover{background:var(--border2);color:var(--text)}
.nav-btn{padding:6px 14px;border-radius:18px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:11.5px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all var(--tr);white-space:nowrap}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn-hl{background:rgba(124,111,224,.15);border-color:rgba(124,111,224,.4);color:var(--accent2)}
.nav-btn-hl:hover{background:rgba(124,111,224,.28);border-color:var(--accent);color:#fff}
#nav-btns{display:flex;align-items:center;gap:7px;flex-shrink:0}

/* ── SEARCH OVERLAY ── */
#search-topbar{position:sticky;top:56px;z-index:190;width:100%;background:rgba(9,9,22,.97);border-bottom:1px solid var(--border2);backdrop-filter:blur(18px);transform:translateY(-100%);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s ease;max-height:calc(100vh - 56px);display:flex;flex-direction:column;overflow:hidden}
#search-topbar.open{transform:translateY(0);opacity:1;pointer-events:all}
#stb-header{display:flex;align-items:center;gap:10px;padding:10px 22px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.stb-lbl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px}
#stb-q{font-size:13px;font-weight:700;color:var(--text);flex:1}
#stb-cnt{padding:2px 9px;border-radius:18px;background:rgba(124,111,224,.2);color:var(--accent2);font-size:11px;font-weight:700;display:none}
#stb-x{width:24px;height:24px;border-radius:7px;border:1px solid var(--border2);background:var(--bg4);color:var(--text2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
#stb-x:hover{background:var(--border2);color:var(--text)}
#stb-grid-wrap{overflow:auto;padding:14px 22px 18px;flex:1;-webkit-overflow-scrolling:touch}
#stb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
#stb-loading{display:flex;align-items:center;gap:8px;padding:18px 22px;color:var(--text2);font-size:12.5px}
.stb-empty{padding:18px 22px;font-size:12.5px;color:var(--text2)}
#search-backdrop{position:fixed;top:56px;left:0;right:0;bottom:0;z-index:150;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s ease}
#search-backdrop.show{opacity:1;pointer-events:all}
.stb-card{display:flex;flex-direction:column;cursor:pointer;border-radius:10px;overflow:hidden;transition:transform .2s}
.stb-card:hover{transform:translateY(-3px)}
.stb-poster{position:relative;width:100%;padding-top:142%;background:var(--bg4);border-radius:10px;overflow:hidden}
.stb-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.stb-card:hover .stb-poster img{transform:scale(1.07)}
.stb-sc{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.78);color:#fbbf24;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}
.stb-type{position:absolute;top:5px;right:5px;background:var(--accent);color:#fff;font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px}
.stb-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,15,.9) 0%,transparent 55%);opacity:0;transition:opacity .22s;display:flex;align-items:center;justify-content:center}
.stb-card:hover .stb-ov{opacity:1}
.stb-play{width:30px;height:30px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center}
.stb-info{padding:6px 2px 2px}
.stb-title{font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stb-sub{font-size:10px;color:var(--text2);margin-top:2px}

/* ── HERO ── */
#hero{position:relative;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;padding:0 30px 36px;background:linear-gradient(135deg,#080820 0%,#080012 50%,#06060f 100%)}
#hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 1.1s ease}
#hero-bg.loaded{opacity:.26}
#hero-ov{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(6,6,15,.72) 50%,rgba(6,6,15,.28) 100%)}
#hero-content{position:relative;z-index:2;max-width:550px}
.hero-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:18px;background:rgba(124,111,224,.18);border:1px solid rgba(124,111,224,.35);font-size:10.5px;font-weight:700;color:var(--accent2);letter-spacing:.06em;margin-bottom:11px}
#hero-title{font-weight:800;font-size:clamp(21px,3.8vw,36px);line-height:1.13;margin-bottom:8px;letter-spacing:-.025em}
#hero-desc{font-size:13px;color:var(--text2);line-height:1.62;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px;max-width:430px}
.hero-meta{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.hero-tag{padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:600;background:var(--bg4);color:var(--text2)}
.hero-sc{color:#fbbf24;font-size:12.5px;font-weight:700}
#hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.hero-btn{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:none;font-size:13.5px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all var(--tr)}
.hero-btn-p{background:var(--grad);color:#fff}
.hero-btn-p:hover{opacity:.9;transform:translateY(-1px)}
.hero-btn-s{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border2)}
.hero-btn-s:hover{background:rgba(255,255,255,.13)}

/* ── SECTIONS ── */
.spin{width:20px;height:20px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.spin-sm{width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.section{padding:26px 22px 4px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.sec-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.see-all{font-size:11.5px;color:var(--accent2);font-weight:600;cursor:pointer;transition:color var(--tr)}
.see-all:hover{color:var(--accent)}
#genre-bar{display:flex;gap:7px;padding:0 22px 18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#genre-bar::-webkit-scrollbar{display:none}
.genre-pill{padding:6px 13px;border-radius:18px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;white-space:nowrap;transition:all var(--tr);flex-shrink:0}
.genre-pill:hover,.genre-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:15px}
.anime-card{cursor:pointer;transition:transform var(--tr);border-radius:var(--card-r);overflow:hidden}
.anime-card:hover{transform:translateY(-4px)}
.card-poster{position:relative;padding-top:148%;background:var(--bg3);overflow:hidden;border-radius:var(--card-r)}
.card-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.anime-card:hover .card-poster img{transform:scale(1.07)}
.card-sc{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.76);backdrop-filter:blur(4px);color:#fbbf24;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;display:flex;align-items:center;gap:3px}
.card-type{position:absolute;top:7px;right:7px;background:var(--accent);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.card-ep{position:absolute;bottom:7px;right:7px;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);color:var(--text2);font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px}
.card-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(6,6,15,.9) 0%,transparent 62%);opacity:0;transition:opacity .28s;display:flex;align-items:flex-end;padding:9px}
.anime-card:hover .card-ov{opacity:1}
.play-ic{width:34px;height:34px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto}
.card-info{padding:7px 2px 2px}
.card-title{font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub2{font-size:10.5px;color:var(--text2);margin-top:2px}
.h-scroll-wrap{overflow-x:auto;padding:0 22px 22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.h-scroll-wrap::-webkit-scrollbar{display:none}
.h-scroll{display:flex;gap:13px}
.h-scroll .anime-card{flex-shrink:0;width:138px}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}
.skel-card{height:200px;border-radius:var(--card-r)}

/* ── EPISODE MODAL ── */
#ep-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:400;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);padding:16px}
#ep-modal-bg.show{display:flex}
#ep-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:510px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.8)}
#ep-modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
#ep-modal-img{width:46px;height:64px;object-fit:cover;border-radius:8px;background:var(--bg4);flex-shrink:0}
#ep-modal-info{flex:1;min-width:0}
#ep-modal-ttl{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
#ep-modal-meta{display:flex;gap:5px;flex-wrap:wrap}
.em-badge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;background:var(--bg4);color:var(--text2)}
#ep-modal-close{background:var(--bg4);border:none;color:var(--text2);width:27px;height:27px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
#em-lang-row{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 7px}
#em-lang-row .lbl{font-size:11.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
#em-lang-btns{display:flex;gap:3px;background:var(--bg3);padding:3px;border-radius:9px;border:1px solid var(--border)}
#em-lang-btns button{padding:4px 11px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-size:11px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all var(--tr)}
#em-lang-btns button.active{background:var(--accent);color:#fff}
#em-ep-search-wrap{padding:0 18px 9px}
#em-ep-search{width:100%;padding:7px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:12px;font-family:'Outfit',sans-serif;outline:none}
#ep-list{padding:8px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;overflow-y:auto;max-height:320px;-webkit-overflow-scrolling:touch}
.ep-btn{height:36px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all var(--tr);display:flex;align-items:center;justify-content:center}
.ep-btn:hover,.ep-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── PLAYER VIEW ── */
#player-topbar{height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:10}
#back-btn{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer}
#back-btn:hover{border-color:var(--accent);color:#fff}
#p-show-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
#p-ep-label{font-size:11.5px;color:var(--text2);font-weight:600}
#p-controls{display:flex;align-items:center;gap:7px}
#p-lang-toggle{display:flex;gap:2px;background:var(--bg3);padding:2px;border-radius:8px;border:1px solid var(--border)}
#p-lang-toggle button{padding:3px 9px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-size:10px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer}
#p-lang-toggle button.active{background:var(--accent);color:#fff}
.ep-nav{display:flex;align-items:center;gap:3px;padding:5px 9px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer}
.ep-nav:hover{border-color:var(--accent);color:#fff}
.an-lbl{font-size:11px;color:var(--text3);font-weight:600}
.sw-sm{position:relative;display:inline-block;width:28px;height:16px}
.sw-sm input{opacity:0;width:0;height:0}
.sl-sm{position:absolute;cursor:pointer;inset:0;background:var(--bg4);transition:.2s;border-radius:16px}
.sl-sm:before{position:absolute;content:"";height:12px;width:12px;left:2px;bottom:2px;background:#fff;transition:.2s;border-radius:50%}
input:checked+.sl-sm{background:var(--accent)}
input:checked+.sl-sm:before{transform:translateX(12px)}

#player-body{display:flex;flex:1;min-height:0;overflow:hidden}
#player-left{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
#player-right{width:var(--side-w);flex-shrink:0;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}

/* video */
#player-main{width:100%;aspect-ratio:16/9;position:relative;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#player-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#06060f;z-index:1}
iframe{width:100%;height:100%;border:none;position:absolute;inset:0;z-index:2}

/* skip */
#skip-bar{position:absolute;bottom:22px;left:22px;z-index:10;display:flex;gap:7px}
.skip-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.8);backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .18s}
.skip-btn:hover{background:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.skip-timer{font-size:10px;opacity:.7}
.auto-skip-toast{cursor:default;border-color:rgba(46,204,142,.4);background:rgba(14,22,18,.9);color:var(--green)}
.auto-skip-toast:hover{background:rgba(14,22,18,.9);border-color:rgba(46,204,142,.4);transform:none}
#autoskip-btn.ast-on{background:var(--accent);border-color:var(--accent);color:#fff}

/* auto next */
#an-overlay{position:absolute;inset:0;z-index:20;background:rgba(6,6,15,.93);backdrop-filter:blur(12px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px}
.an-ttl{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.09em}
.an-ep-lbl{font-weight:800;font-size:22px}
#an-bar-bg{width:200px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin:5px 0 10px}
#an-bar{height:100%;background:var(--accent);width:100%;transform-origin:left}
.an-actions{display:flex;gap:9px}
.an-actions button{padding:7px 16px;border-radius:8px;border:none;font-size:12.5px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer}
#an-play-btn{background:var(--accent);color:#fff}
#an-cancel-btn{background:var(--bg4);color:var(--text)}

/* ── SERVER SECTION ── */
#srv-section{padding:18px 22px 28px;background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.srv-sec-hdr{display:flex;align-items:center;justify-content:space-between}
.srv-sec-title{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;letter-spacing:-.01em}
.srv-sec-title svg{color:var(--accent)}

/* source tabs */
#src-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex-wrap:wrap}
#src-tabs::-webkit-scrollbar{display:none}
.src-t{padding:5px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all var(--tr)}
.src-t.active{background:var(--accent);border-color:var(--accent);color:#fff}
.src-t .src-grp-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;background:currentColor;opacity:.7}

/* server group badges */
.grp-label{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:4px;margin-bottom:6px;display:inline-block}
.grp-mica{background:rgba(124,111,224,.18);color:var(--accent2)}
.grp-dika{background:rgba(6,182,212,.14);color:var(--teal)}

/* server list */
#srv-list-inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px}
.srv-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .14s}
.srv-item:hover,.srv-item.active{border-color:var(--accent);background:var(--bg4)}
.srv-badge{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(124,111,224,.2);color:var(--accent2);font-weight:700}
.srv-badge-mica{background:rgba(124,111,224,.2);color:var(--accent2)}
.srv-badge-dika{background:rgba(6,182,212,.18);color:var(--teal)}
.srv-badge-green{background:rgba(46,204,142,.18);color:var(--green)}
.srv-badge-pink{background:rgba(240,108,160,.18);color:var(--pink)}

#srv-loading{display:none;align-items:center;gap:7px;font-size:12px;color:var(--text2);padding:6px 0}
#srv-loading.show{display:flex}
#qual-row{display:flex;gap:5px;flex-wrap:wrap}
.q-pill{padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer}
.q-pill.active{background:var(--green);color:#000;border-color:var(--green)}
.q-pill.unavail{opacity:.35;cursor:not-allowed}
#skip-info-row{display:none;flex-direction:column;gap:4px;padding-top:5px;border-top:1px solid var(--border)}
#skip-info-row.show{display:flex}
.skip-info-ttl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.05em}
.skip-t-row{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.skip-dot{width:6px;height:6px;border-radius:50%}
.skip-dot-op{background:var(--pink)}
.skip-dot-ed{background:var(--green)}

/* status rows */
.status-row{display:none;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);font-size:11px;color:var(--text2);font-weight:600}
.status-row.show{display:flex}

/* ── RIGHT PANEL ── */
#right-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.right-tab{flex:1;padding:10px 0;text-align:center;font-size:11.5px;font-weight:700;color:var(--text2);font-family:'Outfit',sans-serif;cursor:pointer;border:none;background:none;transition:color var(--tr);position:relative}
.right-tab::after{content:'';position:absolute;bottom:0;left:18%;right:18%;height:2px;background:var(--accent);border-radius:2px 2px 0 0;transform:scaleX(0);transition:transform .2s ease}
.right-tab.active{color:var(--text)}
.right-tab.active::after{transform:scaleX(1)}
#ep-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#ep-panel.hide{display:none}
#ep-panel-hdr{padding:10px 12px 7px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:7px}
.ep-panel-total{font-size:11px;color:var(--text3);font-weight:600;flex:1}
#ep-panel-search-wrap{padding:7px 12px;flex-shrink:0}
#ep-panel-search{width:100%;padding:6px 9px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:11px;font-family:'Outfit',sans-serif;outline:none}
#ep-panel-search:focus{border-color:var(--accent)}
#ep-range-row{display:none;padding:0 12px 7px;gap:4px;flex-wrap:wrap;flex-shrink:0}
#ep-range-row.show{display:flex}
.ep-range-pill{padding:3px 9px;border-radius:6px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:10px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;white-space:nowrap;transition:all var(--tr)}
.ep-range-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
#ep-panel-grid{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;align-content:start;-webkit-overflow-scrolling:touch}
.ep-side-btn{height:32px;border-radius:7px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .13s;display:flex;align-items:center;justify-content:center}
.ep-side-btn:hover{border-color:var(--accent);color:var(--text)}
.ep-side-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 9px rgba(124,111,224,.38)}
#next-panel{flex:1;display:none;flex-direction:column;overflow:hidden}
#next-panel.show{display:flex}
#next-panel-inner{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch}
.next-lbl{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding-bottom:3px}
.next-card{display:flex;gap:9px;cursor:pointer;border-radius:10px;padding:7px;border:1px solid transparent;transition:all .18s;background:var(--bg3)}
.next-card:hover{border-color:var(--accent);background:var(--bg4)}
.next-card-poster{width:48px;height:68px;border-radius:7px;overflow:hidden;background:var(--bg4);flex-shrink:0}
.next-card-poster img{width:100%;height:100%;object-fit:cover}
.next-card-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;justify-content:center}
.next-card-seq{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;color:var(--accent2);background:rgba(124,111,224,.14);padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;width:fit-content;margin-bottom:2px}
.next-card-title{font-size:12px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.next-card-meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.next-card-badge{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--bg4);color:var(--text2);font-weight:600}
.next-card-sc{font-size:10px;color:#fbbf24;font-weight:700}
.next-card-btn{margin-top:4px;display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;width:fit-content}
.next-rel-lbl{font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:5px;padding-top:9px;border-top:1px solid var(--border)}

/* ── RESPONSIVE ── */
@media(max-width:900px){:root{--side-w:252px}#ep-panel-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){
  #player-body{flex-direction:column;overflow-y:auto}
  #player-left{overflow:visible}
  #player-right{width:100%;border-left:none;border-top:1px solid var(--border);height:380px;flex-shrink:0}
  #ep-panel-grid{grid-template-columns:repeat(5,1fr)}
  #navbar{padding:0 12px;gap:9px}
  #hero{padding:0 16px 22px;min-height:340px}
  .section{padding:18px 14px 4px}
  #genre-bar{padding:0 14px 14px}
  .h-scroll-wrap{padding:0 14px 14px}
  #p-controls{gap:3px}
  .an-lbl,#p-lang-toggle{display:none}
  #p-show-title{max-width:130px}
  #src-tabs{gap:3px}
  .src-t{padding:5px 8px;font-size:10px}
  #srv-list-inner{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
}
@media(max-width:480px){
  #navbar{padding:0 9px;gap:5px;height:50px}
  .logo{font-size:16px}
  #search-inp{padding:7px 30px 7px 32px;font-size:12.5px}
  .nav-btn{padding:5px 9px;font-size:10px}
  #hero{min-height:290px;padding:0 12px 16px}
  #hero-title{font-size:clamp(18px,6vw,24px)}
  #hero-desc{-webkit-line-clamp:2;font-size:12px}
  .hero-btn{padding:8px 15px;font-size:12.5px}
  .anime-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}
  #ep-modal{border-radius:16px;max-height:91vh}
  #ep-list{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));padding:7px 14px 14px;gap:5px}
  #ep-panel-grid{grid-template-columns:repeat(4,1fr)}
  #p-show-title{max-width:90px;font-size:12px}
  #player-topbar{padding:0 8px;gap:5px}
}
@media(max-width:400px){.btn-lbl{display:none}#back-btn,.ep-nav{gap:0;padding:5px}}
#search-inp,#em-ep-search{min-width:0}
</style>
</head>
<body>
<div id="root">

<nav id="navbar">
  <div class="logo" onclick="goHome()">AnimeStream<span style="opacity:.7">X</span></div>
  <div id="search-wrap">
    <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search-inp" type="text" placeholder="Search anime…" autocomplete="off">
    <button id="search-clear" title="Clear">✕</button>
  </div>
  <div id="nav-btns">
    <button class="nav-btn nav-btn-hl" onclick="loadSection('airing')">⚡ Airing</button>
    <button class="nav-btn" onclick="loadSection('top')">★ Top</button>
    <button class="nav-btn" onclick="loadSection('popular')">🔥 Popular</button>
  </div>
</nav>

<div id="search-topbar">
  <div id="stb-header">
    <div class="stb-lbl"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Results for</div>
    <div id="stb-q">…</div><div id="stb-cnt"></div>
    <button id="stb-x" onclick="clearSearch()">✕</button>
  </div>
  <div id="stb-loading"><div class="spin-sm"></div><span>Searching…</span></div>
  <div id="stb-grid-wrap" style="display:none"><div id="stb-grid"></div></div>
  <div id="stb-empty" class="stb-empty" style="display:none">No anime found. Try a different title.</div>
</div>
<div id="search-backdrop" onclick="clearSearch()"></div>

<!-- HOME -->
<div id="view-home">
  <section id="hero">
    <div id="hero-bg"></div>
    <div id="hero-ov"></div>
    <div id="hero-content">
      <div class="hero-badge">✦ Featured</div>
      <div id="hero-title">Loading…</div>
      <div class="hero-meta" id="hero-meta"></div>
      <div id="hero-desc"></div>
      <div id="hero-actions">
        <button class="hero-btn hero-btn-p" onclick="heroPlay()"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch Now</button>
        <button class="hero-btn hero-btn-s" onclick="heroPlay()">More Info</button>
      </div>
    </div>
  </section>

  <div id="genre-bar">
    <button class="genre-pill active" onclick="filterGenre(null,this)">All</button>
    <button class="genre-pill" onclick="filterGenre('Action',this)">Action</button>
    <button class="genre-pill" onclick="filterGenre('Adventure',this)">Adventure</button>
    <button class="genre-pill" onclick="filterGenre('Comedy',this)">Comedy</button>
    <button class="genre-pill" onclick="filterGenre('Drama',this)">Drama</button>
    <button class="genre-pill" onclick="filterGenre('Fantasy',this)">Fantasy</button>
    <button class="genre-pill" onclick="filterGenre('Romance',this)">Romance</button>
    <button class="genre-pill" onclick="filterGenre('Sci-Fi',this)">Sci-Fi</button>
    <button class="genre-pill" onclick="filterGenre('Slice of Life',this)">Slice of Life</button>
    <button class="genre-pill" onclick="filterGenre('Supernatural',this)">Supernatural</button>
    <button class="genre-pill" onclick="filterGenre('Mystery',this)">Mystery</button>
    <button class="genre-pill" onclick="filterGenre('Psychological',this)">Psychological</button>
  </div>

  <section class="section"><div class="sec-hdr"><div class="sec-title"><span class="sec-dot"></span> Currently Airing</div><span class="see-all" onclick="loadSection('airing')">See all →</span></div></section>
  <div class="h-scroll-wrap"><div class="h-scroll" id="airing-row"></div></div>
  <section class="section"><div class="sec-hdr"><div class="sec-title"><span class="sec-dot" style="background:var(--pink)"></span> Top Rated</div><span class="see-all" onclick="loadSection('top')">See all →</span></div></section>
  <div class="h-scroll-wrap"><div class="h-scroll" id="top-row"></div></div>
  <section class="section" id="popular-section">
    <div class="sec-hdr"><div class="sec-title"><span class="sec-dot" style="background:var(--green)"></span> Popular Anime</div><span class="see-all" onclick="loadSection('popular')">See all →</span></div>
    <div class="anime-grid" id="popular-grid"></div>
  </section>
  <div style="height:40px"></div>
</div>

<!-- EPISODE MODAL -->
<div id="ep-modal-bg">
  <div id="ep-modal">
    <div id="ep-modal-hdr">
      <img id="ep-modal-img" src="" alt="">
      <div id="ep-modal-info">
        <div id="ep-modal-ttl">—</div>
        <div id="ep-modal-meta"></div>
      </div>
      <button id="ep-modal-close" onclick="closeEpModal()">✕</button>
    </div>
    <div id="em-lang-row">
      <span class="lbl">Audio</span>
      <div id="em-lang-btns">
        <button id="em-dub" class="active" onclick="setModalLang('dub')">DUB</button>
        <button id="em-sub" onclick="setModalLang('sub')">SUB</button>
      </div>
    </div>
    <div id="em-ep-search-wrap"><input id="em-ep-search" type="number" placeholder="Jump to episode…" min="1"></div>
    <div id="ep-list"><div style="grid-column:1/-1;display:flex;justify-content:center;padding:30px 0"><div class="spin"></div></div></div>
  </div>
</div>

<!-- PLAYER -->
<div id="view-player">
  <div id="player-topbar">
    <button id="back-btn" onclick="goHome()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span class="btn-lbl">Back</span>
    </button>
    <div id="p-show-title">—</div>
    <div id="p-ep-label">—</div>
    <div id="p-controls">
      <div id="p-lang-toggle">
        <button id="pl-dub" class="active" onclick="playerSetLang('dub')">DUB</button>
        <button id="pl-sub" onclick="playerSetLang('sub')">SUB</button>
      </div>
      <button class="ep-nav" onclick="playerPrev()"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg><span class="btn-lbl">Prev</span></button>
      <button class="ep-nav" onclick="playerNext()"><span class="btn-lbl">Next</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <span class="an-lbl">Auto-next</span>
      <label class="sw-sm"><input type="checkbox" id="chk-an" checked><span class="sl-sm"></span></label>
    </div>
  </div>

  <div id="player-body">
    <div id="player-left">
      <div id="player-main">
        <div id="player-ph"><div class="spin"></div></div>
        <iframe id="pf-plain" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen referrerpolicy="origin" style="display:none"></iframe>
        <iframe id="pf-sb" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen referrerpolicy="no-referrer" style="display:none"></iframe>
        <iframe id="pf-adblock" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen referrerpolicy="no-referrer" style="display:none"></iframe>

        <div id="skip-bar">
          <button class="skip-btn" id="autoskip-btn" onclick="toggleAutoSkip()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="5 4 15 12 5 20"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
            <span id="ast-lbl">Auto-Skip: Off</span>
          </button>
          <button class="skip-btn" id="skip-op-btn" onclick="skipIntro()" style="display:none">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="5 4 15 12 5 20"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
            Skip Intro <span class="skip-timer" id="skip-op-t"></span>
          </button>
          <button class="skip-btn" id="skip-ed-btn" onclick="skipOutro()" style="display:none">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="5 4 15 12 5 20"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
            Skip Outro <span class="skip-timer" id="skip-ed-t"></span>
          </button>
        </div>

        <div id="an-overlay">
          <div class="an-ttl">Up next</div>
          <div class="an-ep-lbl" id="an-ep-lbl">Episode —</div>
          <div id="an-bar-bg"><div id="an-bar"></div></div>
          <div class="an-actions">
            <button id="an-play-btn" onclick="anPlayNow()">Play Now</button>
            <button id="an-cancel-btn" onclick="cancelAN()">Cancel</button>
          </div>
        </div>
      </div>

      <!-- SERVER SECTION -->
      <div id="srv-section">
        <div class="srv-sec-hdr">
          <div class="srv-sec-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="2" y="3" width="20" height="4" rx="1"/><rect x="2" y="10" width="20" height="4" rx="1"/><rect x="2" y="17" width="20" height="4" rx="1"/></svg>
            STREAM SERVERS
          </div>
        </div>

        <!-- Source tabs — mica_hls group (purple dot) and dika_hls group (teal dot) -->
        <div id="src-tabs">
          <!-- AnisantCH = default instant player (megaplay.buzz behind scenes) -->
          <button class="src-t active" id="tab-ac"       onclick="switchSrc('anisantch')">AnisantCH</button>
          <!-- mica_hls group -->
          <button class="src-t"        id="tab-anizone"  onclick="switchSrc('anizone')"><span class="src-grp-dot" style="background:var(--accent2)"></span>AniZone</button>
          <button class="src-t"        id="tab-animegg"  onclick="switchSrc('animegg_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>AnimeGG</button>
          <button class="src-t"        id="tab-megaplay" onclick="switchSrc('megaplay_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>MegaPlay</button>
          <button class="src-t"        id="tab-vivibebe" onclick="switchSrc('vivibebe_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>ViviBebe</button>
          <button class="src-t"        id="tab-otakuhg"  onclick="switchSrc('otakuhg_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>OtakuHG</button>
          <button class="src-t"        id="tab-oktavi"   onclick="switchSrc('oktavi_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>OktaVi</button>
          <!-- dika_hls group -->
          <button class="src-t"        id="tab-playmongo" onclick="switchSrc('playmongo_az')"><span class="src-grp-dot" style="background:var(--teal)"></span>PlayMongo</button>
          <button class="src-t"        id="tab-flixcloud" onclick="switchSrc('flixcloud_az')"><span class="src-grp-dot" style="background:var(--teal)"></span>FlixCloud</button>
          <button class="src-t"        id="tab-voe"       onclick="switchSrc('voe_az')"><span class="src-grp-dot" style="background:var(--teal)"></span>VOE.sx</button>
          <button class="src-t"        id="tab-reanime"   onclick="switchSrc('reanime_az')"><span class="src-grp-dot" style="background:var(--teal)"></span>ReAnime</button>
          <button class="src-t"        id="tab-kichsas"   onclick="switchSrc('kichsas_az')"><span class="src-grp-dot" style="background:var(--teal)"></span>Kichsas</button>
          <!-- mica_hls secondary group -->
          <button class="src-t"        id="tab-anibd"     onclick="switchSrc('anibd_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>AniBD</button>
          <button class="src-t"        id="tab-anikoto"   onclick="switchSrc('anikoto_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>AniKoto</button>
          <button class="src-t"        id="tab-nosub"     onclick="switchSrc('nosub_az')"><span class="src-grp-dot" style="background:var(--accent2)"></span>AnimeNoSub</button>

function normalizeAL(m){
  if(!m)return null;
  const id=m.idMal||m.id, title=m.title?.english||m.title?.romaji||'Untitled';
  const img=m.coverImage?.large||m.coverImage?.medium||'';
  const score=m.meanScore?(m.meanScore/10).toFixed(1):null;
  const synopsis=m.description?m.description.replace(/<[^>]*>/g,''):'';
  return{mal_id:id,id,title,title_english:m.title?.english||title,images:{jpg:{image_url:m.coverImage?.medium||img,large_image_url:img}},score,type:'TV',episodes:m.episodes||null,status:m.status||'Finished',year:m.seasonYear||'',synopsis,genres:(m.genres||[]).map(g=>({name:g}))};
}
async function alQuery(query,variables){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,variables})});
  if(r.ok)return(await r.json())?.data;
  return null;
}
async function getAiringAnime(){
  const d=await alQuery(`query{Page(perPage:16){media(status:RELEASING,type:ANIME,sort:POPULARITY_DESC){id idMal title{english romaji}coverImage{medium large}meanScore episodes status seasonYear genres description}}}`);
  return(d?.Page?.media||[]).map(normalizeAL).filter(Boolean);
}

}

function showTitle(a){return a.title_english||a.title||'Untitled'}

// Related series
function fetchWT(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
async function getRelatedAnime(malId){
  if(_relatedCache[malId])return _relatedCache[malId];
  try{
    const r=await fetchWT(`${JIKAN_BASE}/anime/${malId}/relations`,9000);
    if(!r.ok){_relatedCache[malId]=[];return[]}
    const data=await r.json();
    const stubs=[];
    for(const rel of(data?.data||[])){
      const rt=(rel.relation||'').toLowerCase();
      if(['sequel','prequel','alternative version','side story','spin-off','parent story'].includes(rt))
        for(const e of(rel.entry||[]))if(e.type==='anime')stubs.push({...e,relation:rel.relation});
    }
    if(!stubs.length){_relatedCache[malId]=[];return[]}
    const full=[];const BATCH=3;
    for(let i=0;i<Math.min(stubs.length,8);i+=BATCH){
      const batch=stubs.slice(i,i+BATCH);
      const res=await Promise.all(batch.map(s=>fetchWT(`${JIKAN_BASE}/anime/${s.mal_id}`,6000).then(r=>r.ok?r.json():null).catch(()=>null).then(d=>d?.data?{...normalizeAL({...d.data,idMal:d.data.mal_id}),relation:s.relation}:{...s,images:s.images||{jpg:{image_url:'',large_image_url:''}}})));
      full.push(...res);
      if(i+BATCH<Math.min(stubs.length,8))await new Promise(r=>setTimeout(r,320));
    }
    _relatedCache[malId]=full;return full;
  }catch{return[]}
}

// ═══════════════════════════════════════════════════════════
//  ANIZONE RENDER API — fetch streams from Python backend
// ═══════════════════════════════════════════════════════════
function buildAZProxyUrl(rawUrl){
  // Route HLS streams through the anivexa proxy just like the example:
  // https://anivexa.onrender.com/proxy?url=<raw_hls>&<referer>
  return `${PROXY_URL}?url=${encodeURIComponent(rawUrl)}`;
}

async function fetchAZStreams(srcId, malId, ep, lang){
  const cacheKey=`${srcId}/${malId}/${ep}/${lang}`;
  if(_azCache[cacheKey]!==undefined)return _azCache[cacheKey];
  if(_azFetching[cacheKey])return _azFetching[cacheKey];

  const serverDef=ALL_AZ_SERVERS.find(s=>s.id===srcId);
  if(!serverDef){_azCache[cacheKey]=[];return[]}

  const audioParam=serverDef.audio||(lang==='sub'?'sub':'dub');
  let url=`${ANIZONE_API}${serverDef.endpoint}/${malId}/${ep}`;
  if(serverDef.audio)url+=`?audio=${audioParam}`;

  _azFetching[cacheKey]=(async()=>{
    try{
      const r=await fetch(url);
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const data=await r.json();
      const streams=extractStreamsFromAZResponse(data, serverDef);
      _azCache[cacheKey]=streams;
      return streams;
    }catch(e){
      console.warn(`[AZ:${srcId}]`,e.message);
      _azCache[cacheKey]=[];
      return[];
    }finally{delete _azFetching[cacheKey]}
  })();
  return _azFetching[cacheKey];
}

function extractStreamsFromAZResponse(data, serverDef){
  const srvs=[];
  const label=serverDef.label, badge=serverDef.badge, group=serverDef.group;

  // Handle various response shapes from the anizone render API
  const results=data.results||data;

  // Shape 1: results.streams array
  if(Array.isArray(results?.streams)){
    results.streams.forEach((s,i)=>{
      if(s.url){
        const proxyUrl=buildAZProxyUrl(s.url);
        srvs.push({key:`${serverDef.id}_${i}`,label:`${label}${s.server?' · '+s.server:''}`,url:proxyUrl,rawUrl:s.url,source:group,badge,isHls:s.type==='hls'});
      }
    });
    return srvs;
  }

  // Shape 2: results.stream_url (single)
  if(results?.stream_url){
    srvs.push({key:serverDef.id+'_0',label,url:buildAZProxyUrl(results.stream_url),rawUrl:results.stream_url,source:group,badge,isHls:true});
    return srvs;
  }

  // Shape 3: results is array of objects with links/master_url
  if(Array.isArray(results)){
    results.forEach((item,i)=>{
      if(item.master_url){
        srvs.push({key:`${serverDef.id}_${i}`,label:`${label} ${item.tag||''}`.trim(),url:buildAZProxyUrl(item.master_url),rawUrl:item.master_url,source:group,badge,isHls:true});
      }else if(item.links){
        Object.entries(item.links).forEach(([k,u],j)=>{
          srvs.push({key:`${serverDef.id}_${i}_${j}`,label:`${label} ${k.toUpperCase()}`,url:buildAZProxyUrl(u),rawUrl:u,source:group,badge,isHls:u.includes('.m3u8')});
        });
      }
    });
    return srvs;
  }

  // Shape 4: results has a sub/dub key (AniDB-style)
  ['dub','sub'].forEach(audio=>{
    if(results?.[audio]){
      const s=results[audio];
      const u=s.url||s.stream_url||(typeof s==='string'?s:null);
      if(u)srvs.push({key:`${serverDef.id}_${audio}`,label:`${label} ${audio.toUpperCase()}`,url:buildAZProxyUrl(u),rawUrl:u,source:group,badge,isHls:u.includes('.m3u8')});
    }
  });

  return srvs;
}

// ═══════════════════════════════════════════════════════════
//  RENDER AZ SERVER LIST

async function loadAndRenderAZSrc(srcId){
  const list=document.getElementById('srv-list-inner');
  const qRow=document.getElementById('qual-row');
  list.innerHTML=''; qRow.innerHTML=''; qRow.style.display='none';
  document.getElementById('srv-loading').classList.add('show');
  setStatus('');

  const serverDef=ALL_AZ_SERVERS.find(s=>s.id===srcId);
  const grpLabel=serverDef?.group==='dika_hls'
    ?'<span class="grp-label grp-dika">dika_hls</span>'
    :'<span class="grp-label grp-mica">mica_hls</span>';
  list.innerHTML=grpLabel;

  const streams=await fetchAZStreams(srcId, playerMalId, playerEp, playerLang);
  document.getElementById('srv-loading').classList.remove('show');

  if(!streams.length){
    const div=document.createElement('div');
    div.style.cssText='grid-column:1/-1;font-size:12px;color:var(--text2);padding:8px 0;line-height:1.6';
    div.innerHTML=`No streams found from <b>${serverDef?.label||srcId}</b> for this episode.<br><span style="font-size:11px;color:var(--text3)">Try another server tab.</span>`;
    list.appendChild(div);
    setStatus(`✗ No streams — ${serverDef?.label||srcId}`, false);
    return;
  }

  setStatus(`✓ ${serverDef?.label} — ${streams.length} stream${streams.length>1?'s':''}`, true);

  streams.forEach((srv,i)=>{
    const btn=document.createElement('button');
    btn.className='srv-item'+(i===0?' active':'');
    const badgeCls=srv.badge==='dika'?'srv-badge-dika':'srv-badge-mica';
    btn.innerHTML=`<span>${srv.label}</span><span class="srv-badge ${badgeCls}">${srv.badge==='mica'?'M-HLS':'D-HLS'}</span>`;
    btn.onclick=()=>{
      document.querySelectorAll('.srv-item').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeServer=srv; prefSrvKey=srv.key;
      playAZSrv(srv);
    };
    list.appendChild(btn);
    if(i===0){activeServer=srv; playAZSrv(srv);}
  });
}

function playAZSrv(srv){
  if(!srv?.url)return;
  // AniZone streams go through the proxy URL — play in plain iframe (no sandbox)
  // The proxy URL is already built: https://anivexa.onrender.com/proxy?url=...
  loadIframe(srv.url, false, true);
  watchEnd(document.getElementById('pf-plain'), playerMalId, playerEp, playerLang);
}

async function loadACRaw(){
  if(_acCache)return _acCache;
  if(_acLoadProm)return _acLoadProm;
  _acLoadProm=Promise.all(JSON_FILES.map(f=>fetch(JSON_BASE+f).then(r=>r.ok?r.json():[]).catch(()=>[]))).then(res=>{_acCache=res.flat();_acLoadProm=null;return _acCache});
  return _acLoadProm;
}
async function fetchACEntry(malId,ep,lang){
  const key=`${malId}/${ep}==${lang}`, altKey=`${malId}/${ep}==${lang==='dub'?'sub':'dub'}`;
  const all=await loadACRaw();
  return all.find(e=>e.mal_id_with_ep_and_stream_type===key)||all.find(e=>e.mal_id_with_ep_and_stream_type===altKey)||null;
}
function getAllanimeUrl(entry,q){
  const want=parseInt(q),avail=Q_TIERS.filter(t=>entry[`allanime_${t}`]);
  if(!avail.length)return null;
  const best=avail.reduce((a,b)=>Math.abs(a-want)<=Math.abs(b-want)?a:b);
  return entry[`allanime_${best}`]||null;
}
function buildACSrvs(entry){
  const s=[];
  if(Q_TIERS.some(q=>entry[`allanime_${q}`]))s.push({key:'allanime',label:'AllanimeHD',type:'multi-quality',entry,source:'anisantch'});
  if(entry.anivibe)s.push({key:'anivibe',label:'AniVibe',url:entry.anivibe,source:'anisantch'});
  if(entry.okcdn)s.push({key:'okcdn',label:'OkCDN',url:entry.okcdn,source:'anisantch'});
  return s;
}
function renderACList(){
  const qRow=document.getElementById('qual-row'),list=document.getElementById('srv-list-inner');
  qRow.innerHTML='';list.innerHTML='';qRow.style.display='';
  document.getElementById('srv-loading').classList.remove('show');
  if(!serverData.length){list.innerHTML='<div style="grid-column:1/-1;font-size:12px;color:var(--text2);padding:6px 0">No AnisantCH servers for this episode.</div>';return}
  const allanime=serverData.find(s=>s.type==='multi-quality');
  if(allanime)Q_TIERS.forEach(q=>{
    const avail=!!allanime.entry[`allanime_${q}`];
    const pill=document.createElement('button');pill.className='q-pill'+(q===parseInt(activeQual)?' active':'')+(avail?'':' unavail');pill.textContent=q+'p';
    if(avail)pill.onclick=()=>{activeQual=String(q);document.querySelectorAll('.q-pill').forEach(p=>p.classList.remove('active'));pill.classList.add('active');if(activeServer?.key==='allanime')playSrv(activeServer)};
    qRow.appendChild(pill);
  });
  const di=prefSrvKey?Math.max(0,serverData.findIndex(s=>s.key===prefSrvKey)):0;
  serverData.forEach((srv,i)=>{
    const btn=document.createElement('button');btn.className='srv-item'+(i===di?' active':'');
    btn.innerHTML=`<span>${srv.label}</span><span class="srv-badge">${srv.badge||'HD'}</span>`;
    btn.onclick=()=>{document.querySelectorAll('.srv-item').forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeServer=srv;prefSrvKey=srv.key;playSrv(srv)};
    list.appendChild(btn);if(i===di)activeServer=srv;
  });
  if(serverData[di])playSrv(serverData[di]);
}

async function fetchHiEntry(malId,ep){

function getHiUrl(entry,lang,ss){

async function fetchSkipTimes(malId,ep){
  if(!malId||!ep)return;skipTimes={op:null,ed:null};clearSkipUI();
  try{
    const r=await fetch(`${ANISKIP_BASE}/${malId}/${ep}?types[]=op&types[]=ed&episodeLength=0`);
    if(!r.ok)return;const data=await r.json();
    if(!data.found||!data.results?.length)return;
    for(const item of data.results){
      if(item.skip_type==='op')skipTimes.op={start:item.interval.start_time,end:item.interval.end_time};
      if(item.skip_type==='ed')skipTimes.ed={start:item.interval.start_time,end:item.interval.end_time};
    }
    updateSkipInfoPanel();startSkipFakeClock();
  }catch(e){}
}
function clearSkipUI(){document.getElementById('skip-op-btn').style.display='none';document.getElementById('skip-ed-btn').style.display='none';document.getElementById('skip-info-row').classList.remove('show');document.getElementById('skip-info-inner').innerHTML='';stopSkipFakeClock()}
function updateSkipInfoPanel(){
  const inner=document.getElementById('skip-info-inner');inner.innerHTML='';const row=document.getElementById('skip-info-row');
  if(!skipTimes.op&&!skipTimes.ed){row.classList.remove('show');return}
  row.classList.add('show');
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  if(skipTimes.op)inner.innerHTML+=`<div class="skip-t-row"><div class="skip-dot skip-dot-op"></div><span>${fmt(skipTimes.op.start)} – ${fmt(skipTimes.op.end)}</span></div>`;
  if(skipTimes.ed)inner.innerHTML+=`<div class="skip-t-row"><div class="skip-dot skip-dot-ed"></div><span>${fmt(skipTimes.ed.start)} – ${fmt(skipTimes.ed.end)}</span></div>`;
}
function startSkipFakeClock(){
  stopSkipFakeClock();skipFakeTime=0;
  skipFakeTimer=setInterval(()=>{
    skipFakeTime++;const t=skipFakeTime;
    const opBtn=document.getElementById('skip-op-btn'),edBtn=document.getElementById('skip-ed-btn');
    if(skipTimes.op&&t>=skipTimes.op.start-2&&t<skipTimes.op.end){
      if(autoSkipEnabled&&t>=skipTimes.op.start){skipIntro(true);return}
      const rem=Math.max(0,Math.round(skipTimes.op.end-t));opBtn.style.display='';document.getElementById('skip-op-t').textContent=rem>0?rem+'s':'';
    }else opBtn.style.display='none';
    if(skipTimes.ed&&t>=skipTimes.ed.start-2&&t<skipTimes.ed.end){
      if(autoSkipEnabled&&t>=skipTimes.ed.start){skipOutro(true);return}
      const rem=Math.max(0,Math.round(skipTimes.ed.end-t));edBtn.style.display='';document.getElementById('skip-ed-t').textContent=rem>0?rem+'s':'';
    }else edBtn.style.display='none';
  },1000);
}
function stopSkipFakeClock(){if(skipFakeTimer){clearInterval(skipFakeTimer);skipFakeTimer=null}skipFakeTime=0}
function skipIntro(auto){if(!skipTimes.op)return;skipFakeTime=Math.ceil(skipTimes.op.end)+1;document.getElementById('skip-op-btn').style.display='none';if(auto)flashAutoSkipToast('Intro')}
function skipOutro(auto){if(!skipTimes.ed)return;skipFakeTime=Math.ceil(skipTimes.ed.end)+1;document.getElementById('skip-ed-btn').style.display='none';if(auto)flashAutoSkipToast('Outro')}
function toggleAutoSkip(){autoSkipEnabled=!autoSkipEnabled;localStorage.setItem('autoSkipEnabled',autoSkipEnabled?'1':'0');updateASBtn()}
function updateASBtn(){const btn=document.getElementById('autoskip-btn'),lbl=document.getElementById('ast-lbl');lbl.textContent=autoSkipEnabled?'Auto-Skip: On':'Auto-Skip: Off';btn.classList.toggle('ast-on',autoSkipEnabled)}
function flashAutoSkipToast(label){
  const bar=document.getElementById('skip-bar');bar.querySelectorAll('.auto-skip-toast').forEach(e=>e.remove());
  const toast=document.createElement('div');toast.className='skip-btn auto-skip-toast';toast.style.cssText='opacity:1;transition:opacity .4s ease';
  toast.innerHTML=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="5 4 15 12 5 20"/><line x1="19" y1="4" x2="19" y2="20"/></svg> ${label} skipped`;
  bar.appendChild(toast);bar.classList.add('show');
  setTimeout(()=>{toast.style.opacity='0'},1300);setTimeout(()=>toast.remove(),1800);
}

  const rangeRow=document.getElementById('ep-range-row');rangeRow.innerHTML='';

      const pill=document.createElement('button');pill.className='ep-range-pill'+(start===activeRangeStart?' active':'');
      pill.textContent=start===end?`${start}`:`${start}–${end}`;
      pill.onclick=()=>{activeRangeStart=start;document.querySelectorAll('.ep-range-pill').forEach(p=>p.classList.remove('active'));pill.classList.add('active');renderEpGrid(total,currentEp,start)};
      rangeRow.appendChild(pill);
    }
  }else rangeRow.classList.remove('show');
  renderEpGrid(total,currentEp,activeRangeStart);
  const searchEl=document.getElementById('ep-panel-search'),newSearch=searchEl.cloneNode(true);
  searchEl.parentNode.replaceChild(newSearch,searchEl);newSearch.max=total;
  newSearch.addEventListener('input',function(){
    const v=parseInt(this.value);if(isNaN(v)||v<1||v>total)return;
    if(total>EP_RANGE_SIZE){const rIdx=Math.floor((v-1)/EP_RANGE_SIZE),start=rIdx*EP_RANGE_SIZE+1;if(start!==activeRangeStart){activeRangeStart=start;document.querySelectorAll('.ep-range-pill').forEach((p,i)=>p.classList.toggle('active',i===rIdx));renderEpGrid(total,currentEp,start)}}
    const btn=document.querySelector(`.ep-side-btn[data-ep="${v}"]`);if(btn){document.querySelectorAll('.ep-side-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');btn.scrollIntoView({block:'center',behavior:'smooth'})}
  });
}
function renderEpGrid(total,currentEp,rangeStart){
  const grid=document.getElementById('ep-panel-grid');grid.innerHTML='';
  const end=Math.min(rangeStart+EP_RANGE_SIZE-1,total),frag=document.createDocumentFragment();
  for(let i=rangeStart;i<=end;i++){
    const btn=document.createElement('button');btn.className='ep-side-btn'+(i===currentEp?' active':'');btn.textContent=i;btn.dataset.ep=i;
    btn.onclick=()=>{playerEp=i;document.querySelectorAll('.ep-side-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadEpisode(playerMalId,i,playerLang);document.getElementById('p-ep-label').textContent=`Episode ${i}`};
    frag.appendChild(btn);
  }
  grid.appendChild(frag);
  const active=grid.querySelector('.ep-side-btn.active');if(active)setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),80);
}
function updateSideEpActive(ep){
  document.querySelectorAll('.ep-side-btn').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.ep)===parseInt(ep)));
  const active=document.querySelector('.ep-side-btn.active');if(active)active.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function switchRightTab(tab){
  currentRightTab=tab;
  document.getElementById('rtab-eps').classList.toggle('active',tab==='eps');
  document.getElementById('rtab-next').classList.toggle('active',tab==='next');
  document.getElementById('ep-panel').classList.toggle('hide',tab!=='eps');
  const np=document.getElementById('next-panel');np.classList.toggle('show',tab==='next');
}

// ═══════════════════════════════════════════════════════════
//  NEXT SERIES PANEL
// ═══════════════════════════════════════════════════════════
const REL_ORDER=['Sequel','Prequel','Parent Story','Side Story','Alternative Version','Spin-off'];
const REL_LABELS={'Sequel':'➜ Next in Series','Prequel':'◀ Prequel','Side Story':'⊕ Side Story','Alternative Version':'≈ Alt Version','Spin-off':'↗ Spin-off','Parent Story':'▲ Main Story'};
let _nextToken=0;
async function loadNextSeriesPanel(malId){
  const inner=document.getElementById('next-panel-inner');const tok=++_nextToken;
  inner.innerHTML='<div style="display:flex;align-items:center;gap:7px;padding:16px 0;font-size:12px;color:var(--text2)"><div class="spin-sm"></div><span>Finding related series…</span></div>';
  const related=await getRelatedAnime(malId);if(tok!==_nextToken)return;
  if(!related.length){inner.innerHTML='<div style="font-size:12px;color:var(--text2);padding:14px 0">No related series found.</div>';return}
  const grouped={};
  for(const r of related){const rel=r.relation||'Other';if(!grouped[rel])grouped[rel]=[];grouped[rel].push(r)}
  inner.innerHTML='';
  const sortedRels=Object.keys(grouped).sort((a,b)=>(REL_ORDER.indexOf(a)===-1?99:REL_ORDER.indexOf(a))-(REL_ORDER.indexOf(b)===-1?99:REL_ORDER.indexOf(b)));
  for(const rel of sortedRels){
    const gl=document.createElement('div');gl.className=rel===sortedRels[0]?'next-lbl':'next-rel-lbl';gl.textContent=REL_LABELS[rel]||rel;inner.appendChild(gl);
    for(const item of grouped[rel].slice(0,5)){
      const card=document.createElement('div');card.className='next-card';
      const img=item.images?.jpg?.image_url||'',score=item.score?`★ ${item.score}`:'',eps=item.episodes?`${item.episodes} eps`:'';
      card.innerHTML=`<div class="next-card-poster"><img src="${img}" alt="" loading="lazy"></div><div class="next-card-info"><div class="next-card-seq"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>${REL_LABELS[rel]||rel}</div><div class="next-card-title">${showTitle(item)}</div><div class="next-card-meta">${score?`<span class="next-card-sc">${score}</span>`:''} ${eps?`<span class="next-card-badge">${eps}</span>`:''} ${item.year?`<span class="next-card-badge">${item.year}</span>`:''}</div><button class="next-card-btn"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch</button></div>`;
      card.querySelector('.next-card-btn').onclick=e=>{e.stopPropagation();openEpModal(item)};
      card.onclick=()=>openEpModal(item);inner.appendChild(card);
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  PLAYER CONTROLS & AUTO-NEXT
// ═══════════════════════════════════════════════════════════
function playerSetLang(lang){playerLang=lang;document.getElementById('pl-dub').classList.toggle('active',lang==='dub');document.getElementById('pl-sub').classList.toggle('active',lang==='sub');loadEpisode(playerMalId,playerEp,lang)}
function playerPrev(){if(playerEp>1){playerEp--;loadEpisode(playerMalId,playerEp,playerLang);document.getElementById('p-ep-label').textContent=`Episode ${playerEp}`;updateSideEpActive(playerEp)}}
function playerNext(){playerEp++;loadEpisode(playerMalId,playerEp,playerLang);document.getElementById('p-ep-label').textContent=`Episode ${playerEp}`;updateSideEpActive(playerEp)}
function stopEndWatch(){clearInterval(endWatchInt);endWatchInt=null;if(endWatchClean){endWatchClean();endWatchClean=null}}
function watchEnd(iframe,malId,ep,lang){
  stopEndWatch();let active=true;
  function onMsg(e){if(!active)return;const s=typeof e.data==='string'?e.data:JSON.stringify(e.data||'');if(/ended|complete|finish|event.*end/i.test(s)){cleanup();triggerAN(malId,ep,lang)}}
  window.addEventListener('message',onMsg);
  function cleanup(){active=false;clearInterval(endWatchInt);endWatchInt=null;window.removeEventListener('message',onMsg);endWatchClean=null}
  endWatchClean=cleanup;
}
function triggerAN(malId,ep,lang){
  if(!document.getElementById('chk-an').checked)return;
  const next=parseInt(ep)+1;document.getElementById('an-ep-lbl').textContent=`Episode ${next}`;
  const ov=document.getElementById('an-overlay'),bar=document.getElementById('an-bar');
  ov.style.display='flex';bar.style.transition='none';bar.style.transform='scaleX(1)';bar.getBoundingClientRect();
  bar.style.transition=`transform ${COUNTDOWN}s linear`;bar.style.transform='scaleX(0)';
  let rem=COUNTDOWN;anTimer=setInterval(()=>{if(--rem<=0)anPlayNow()},1000);
}
function anPlayNow(){cancelAN();playerNext()}
function cancelAN(){
  clearInterval(anTimer);anTimer=null;
  const ov=document.getElementById('an-overlay');if(ov)ov.style.display='none';
  stopEndWatch();
}

updateASBtn();
initHome();
